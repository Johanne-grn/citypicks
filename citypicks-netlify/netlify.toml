[build]
  publish = "."
  # Les deux agents IA (assistant et planificateur) sont des Edge Functions :
  # elles peuvent attendre la réponse de Gemini jusqu'à ~40 s (contre 10 s pour une fonction classique gratuite).
  edge_functions = "netlify/edge-functions"

# En-têtes de sécurité de base
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
